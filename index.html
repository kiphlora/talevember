<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talevember</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <!-- ================= HERO SECTION ================= -->
  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1 id="talevember-brand">Tale<span class="highlight">vember</span></h1>
      <p class="subtitle">30 days of daily writing prompts for creators</p>
      <p class="subtitle2"></p>
      <a href="#calendar-section" class="cta">View November 2026 Prompts</a>
    </div>
  </section>

  <!-- ================= CALENDAR SECTION ================= -->
  <section id="calendar-section" class="calendar-section">
    <div class="calendar-header">
      <h2 id="month-year"></h2>
    </div>

    <!-- Day-of-week headers -->
    <div class="day-labels">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
      <div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <!-- Calendar grid -->
    <div class="calendar" id="calendar"></div>
  </section>

  <!-- ================= MODAL POPUP ================= -->
  <div id="prompt-modal" class="modal-backdrop hidden" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close modal">&times;</button>

      <div class="modal-header">
        <div class="modal-nav-bar">
          <button id="modal-prev-btn" class="modal-nav-btn" aria-label="Previous day">&larr; Prev</button>
          <span id="modal-day-badge" class="modal-day-badge">Day 1</span>
          <button id="modal-next-btn" class="modal-nav-btn" aria-label="Next day">Next &rarr;</button>
        </div>
        <h2 id="modal-title" class="modal-title">Prompt Title</h2>
        <p id="modal-subtitle" class="modal-subtitle"></p>
      </div>

      <div class="modal-body">
        <p id="modal-description">Prompt description goes here...</p>
      </div>

      <div class="modal-footer">
        <button id="modal-complete-btn" class="modal-complete-btn">
          <span class="btn-icon"></span>
          <span class="btn-text">Mark as Completed</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>Created for storytellers of all kinds everywhere.</p>
    <p>&copy; 2025-Present BAM.</p>
  </footer>

  <script src="src/main.js"></script>
</body>
</html>
